[package]
name = "rscreen"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "A modern, elegant terminal multiplexer inspired by GNU Screen"
license = "MIT"
readme = "README.md"
keywords = ["terminal", "multiplexer", "screen", "tui", "pty"]
categories = ["command-line-utilities"]

[lib]
name = "rscreen"
path = "src/lib.rs"

[[bin]]
name = "rscreen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
libc = "0.2"
nix = { version = "0.29", features = ["fs", "ioctl", "poll", "process", "signal", "term"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "0.9"
unicode-width = "0.2"
vte = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
